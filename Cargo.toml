[package]
    name = "trash_utilities"
    version = "0.1.0"
    edition = "2024"
    resolver = "3"
    rust-version = "1.92"
    description = "Azzybana Raccoon's comprehensive async, threading, memory management, and utility functions"
    authors = ["Azzybana Raccoon"]
    license = "Apache-2.0"
    readme = "README.md"
    keywords = [
        "async",
        "futures",
        "logging",
        "memory",
        "utility",
    ]
    categories = [
        "asynchronous",
        "concurrency",
        "development-tools",
        "development-tools::debugging",
        "memory-management",
    ]
    publish = false

[lib]
    name = "trash_utilities"
    path = "src/lib.rs"
    crate-type = ["rlib"]

[dependencies]

    # Async
    crossfire = { version = "2.1.6", features = ["smol"] }
    parking_lot = { version = "0.12.5", features = [
        "serde",
    ] }
    smol = "2.0.2"
    smol-cancellation-token = "0.1.0"
    futures-lite = "2.6.1"

    # Serialization
    serde = { version = "1.0.228", features = ["derive"] }
    serde_json = { version = "1.0.145" }
    schemars = { version = "1.0.4", features = [
        "bytes1",
        "chrono04",
    ] }

    # Performance
    memchr = { version = "2.7.6", features = ["use_std"] }
    bytes = { version = "1.10.1", features = ["serde"] }
    ahash = { version = "0.8.12", features = ["serde"] }
    mimalloc = { version = "0.1.48", features = [
        "extended",
        "v3",
    ] }

    # Utilities
    chrono = { version = "0.4.42", features = ["serde"] }
    base64 = { version = "0.22.1" }
    tempfile = { version = "3.23.0" }
    fork_union = { version = "2.3.0" }
    brotli = { version = "8.0.2", features = [
        "simd",
        "vector_scratch_space",
    ] }
    arc-swap = { version = "1.7.1", features = ["serde"] }
    once_cell = "1.21.3"

[lints.clippy]
    correctness = "warn"
    suspicious = "warn"
    style = "warn"
    complexity = "warn"
    perf = "warn"
    pedantic = "warn"
